name: Publish GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Glad generator requirements
        run: python -m pip install --requirement lib/glad/requirements.txt

      - name: Verify submodule sources
        run: |
          test -f lib/glad/cmake/CMakeLists.txt
          test -f lib/glad/glad/__main__.py
          test -f lib/glfw/include/GLFW/glfw3.h
          test -f lib/openal/include/AL/al.h
          test -f lib/stb/stb_image.h
          test -f lib/nuklear/nuklear.h

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.3

      - name: Verify Emscripten
        run: emcc -v

      - name: Verify Glad generator
        run: python -c "import jinja2"

      - name: Build website examples
        run: python scripts/cgl.py build-all --platform wasm --site --jobs 2

      - name: Stage Wasm builds and thumbnails
        run: python scripts/cgl.py stage-site

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
