<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <title>{{TITLE}} - CGL Web Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #090b10;
        color: #f1f3f5;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        width: min(100vw, 133.333vh);
        height: min(75vw, 100vh);
        border: 0;
        outline: none;
      }

      .page-panel {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 1;
        width: min(22rem, calc(100vw - 2rem));
        max-height: calc(100vh - 2rem);
        overflow: auto;
        padding: 1rem;
        border: 1px solid #343a46;
        border-radius: 0.75rem;
        background: rgb(21 25 34 / 94%);
        box-shadow: 0 0.5rem 2rem rgb(0 0 0 / 35%);
      }

      .page-panel[hidden] {
        display: none;
      }

      .page-panel-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 0.75rem;
        font-weight: 650;
      }

      #page-panel-close,
      .page-action {
        border: 1px solid #414957;
        border-radius: 0.45rem;
        background: #252b36;
        color: inherit;
        font: inherit;
      }

      #page-panel-close {
        width: 2rem;
        height: 2rem;
        cursor: pointer;
      }

      #page-instructions {
        display: grid;
        gap: 0.45rem;
        margin: 0;
        padding-left: 1.2rem;
        color: #d8dee9;
        font-size: 0.9rem;
        line-height: 1.4;
      }

      #page-actions {
        display: grid;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .page-action {
        padding: 0.55rem 0.75rem;
        cursor: pointer;
        text-align: left;
      }

      .page-action:hover:not(:disabled),
      #page-panel-close:hover {
        background: #343c4a;
      }

      .page-action:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        position: fixed;
        inset: auto 1rem 1rem;
        z-index: 2;
        width: fit-content;
        max-width: calc(100vw - 2rem);
        margin: auto;
        padding: 0.65rem 0.9rem;
        border: 1px solid #343a46;
        border-radius: 0.5rem;
        background: #151922;
        color: #d8dee9;
        font-size: 0.875rem;
      }

      #status[hidden] {
        display: none;
      }

      #status.error {
        color: #ffb4ab;
      }
    </style>
  </head>
  <body>
    {{GENERATED_MARKER}}
    <canvas id="cglCanvas" width="800" height="600" tabindex="0"></canvas>
    <section id="page-panel" class="page-panel" aria-label="Example controls" hidden>
      <div class="page-panel-heading">
        <span>Controls</span>
        <button id="page-panel-close" type="button" aria-label="Hide controls">×</button>
      </div>
      <ul id="page-instructions"></ul>
      <div id="page-actions"></div>
    </section>
    <div id="status" role="status" aria-live="polite">Loading WebAssembly…</div>
    <script id="cgl-page-config" type="application/json">{{PAGE_CONFIG}}</script>
    <script>
      var pageConfig = JSON.parse(document.getElementById("cgl-page-config").textContent);
      var statusElement = document.getElementById("status");
      var canvasElement = document.getElementById("cglCanvas");
      var pagePanel = document.getElementById("page-panel");
      var instructionsElement = document.getElementById("page-instructions");
      var actionsElement = document.getElementById("page-actions");
      var pageActionButtons = [];

      (pageConfig.instructions || []).forEach(function (instruction) {
        var item = document.createElement("li");
        item.textContent = instruction;
        instructionsElement.appendChild(item);
      });

      (pageConfig.file_actions || []).forEach(function (action) {
        var button = document.createElement("button");
        button.className = "page-action";
        button.type = "button";
        button.textContent = action.label;
        button.disabled = true;
        pageActionButtons.push(button);
        button.addEventListener("click", async function () {
          button.disabled = true;
          statusElement.hidden = false;
          statusElement.classList.remove("error");
          statusElement.textContent = "Loading " + action.label + "…";

          try {
            var response = await fetch(action.url);
            if (!response.ok) {
              throw new Error("HTTP " + response.status);
            }
            var bytes = new Uint8Array(await response.arrayBuffer());
            var fileSystem = Module.FS || (typeof FS !== "undefined" ? FS : null);
            if (!fileSystem || !Module.ccall) {
              throw new Error("The WebAssembly file API is not ready");
            }
            fileSystem.writeFile(action.virtual_path, bytes);
            try {
              Module.ccall(action.function, "number", ["string"], [action.virtual_path]);
            } finally {
              fileSystem.unlink(action.virtual_path);
            }
            statusElement.hidden = true;
          } catch (error) {
            statusElement.textContent = "Could not load " + action.label + ". See the browser console for details.";
            statusElement.classList.add("error");
            console.error(error);
          } finally {
            button.disabled = false;
          }
        });
        actionsElement.appendChild(button);
      });

      pagePanel.hidden =
        !(pageConfig.instructions || []).length && !(pageConfig.file_actions || []).length;
      document.getElementById("page-panel-close").addEventListener("click", function () {
        pagePanel.hidden = true;
      });

      window.CGLPage = window.CGLPage || {};
      var Module = {
        canvas: canvasElement,
        onRuntimeInitialized: function () {
          statusElement.hidden = true;
          pageActionButtons.forEach(function (button) {
            button.disabled = false;
          });
          if (typeof window.CGLPage.init === "function") {
            window.CGLPage.init({
              Module: Module,
              canvas: canvasElement,
              config: pageConfig,
            });
          }
        },
        onAbort: function (reason) {
          statusElement.textContent = "WebAssembly failed to start. See the browser console for details.";
          statusElement.classList.add("error");
          console.error(reason);
        },
        print: function () {
          console.log.apply(console, arguments);
        },
        printErr: function () {
          console.error.apply(console, arguments);
        },
      };
    </script>
    {{CUSTOM_SCRIPT_TAG}}
    <script
      src="./cglweb.js"
      onerror="var status = document.getElementById('status'); status.textContent = 'Could not load cglweb.js. Build this example for WebAssembly first.'; status.classList.add('error');"
    ></script>
  </body>
</html>
